name: school
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^9.1.1
  dartz: ^0.10.1

  equatable: ^2.0.5

  get_it: ^9.2.1
  internet_connection_checker: ^3.0.1
  http: ^1.6.0
  shared_preferences: ^2.2.3
  google_generative_ai: ^0.4.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  # file_picker: ^5.5.0
  # image_picker: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_native_splash: ^2.4.4
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  # workmanager: ^0.9.0+3

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_intl:
  enabled: true

flutter_native_splash:
  color: "#ffffff"
  image: assets/logo.png

  android_12:
    color: "#ffffff"
    image: assets/logo.png
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
